---
# See https://docs.ansible.com/projects/ansible/latest/dev_guide/collections_galaxy_meta.html

namespace: ohioit
name: roles
version: 0.0.0 # x-release-please-version
readme: README.md
authors:
  - Kyle Barstow <barstown@ohio.edu> (https://github.com/barstown)
description: Ansible collection for general system configuration.
license_file: LICENSE
tags:
  - linux
  - roles
  - sysops
  - windows

# Ranges are hand-maintained; Renovate's ansible-galaxy manager is off.
#
# ansible.posix is declared even though f.lsr requires it too, because
# roles/firewall calls ansible.posix.firewalld by name. Our range has to stay
# compatible with f.lsr's, so move the two together: f.lsr 2.4.2 requires
# ansible.posix <2.2.0, and 2.5.0 relaxes it to "*".
dependencies:
  fedora.linux_system_roles: "2.4.2"
  ansible.posix: ">=2.1.0,<2.2.0"

repository: https://github.com/ohioit/ohioit.roles
homepage: https://github.com/ohioit/ohioit.roles
issues: https://github.com/ohioit/ohioit.roles/issues

build_ignore:
  # https://docs.ansible.com/projects/ansible/devel/dev_guide/developing_collections_distributing.html#ignoring-files-and-folders
  #
  # What a user installing from Galaxy should get: roles/, meta/, docs/docsite/,
  # README, LICENSE and the changelog. Everything else here is how the
  # collection is built and tested, and none of it belongs in their tarball.
  #
  # Check this with `ansible-galaxy collection build` and `tar tzf`: a directory
  # left off this list is shipped silently, and local artifacts like .ansible/
  # (written by `ansible-galaxy collection install`) are easy to miss because
  # git ignores them and the build does not.

  # Editor, container and repo configuration
  - .devcontainer
  - .editorconfig
  - .github
  - .gitignore
  - .markdownlint.jsonc
  - .mise.toml
  - .prettierrc.json5
  - .renovaterc.json5
  - .vscode
  - .yamllint.yml
  - .ansible-lint
  - .ansible-lint-ignore

  # Build, test and release tooling
  - .release-please-manifest.json
  - release-please-config.json
  - codecov.yml
  - extensions
  - lanes
  - pyproject.toml
  - tests
  - tools
  - uv.lock

  # Local artifacts. Not in git, but the build walks the working tree.
  - .ansible
  - .pytest_cache
  - .ruff_cache
  - .venv
  - .scratch

  # Documentation for contributors and agents rather than for users
  - AGENTS.md
  - CONTEXT.md
  - REVIEW_CHECKLIST.md
  - docs/adr
  - docs/agents
  - docs/github-repo-settings.md
  - docs/role-readme-skeleton.md
  - changelogs/.plugin-cache.yaml
