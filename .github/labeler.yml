---
actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/*.yml"

devcontainer:
  - changed-files:
      - any-glob-to-any-file:
          - ".devcontainer/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**

# Was `*.yml`, which matched root galaxy.yml and codecov.yml and labelled
# unrelated pull requests as role changes.
roles:
  - changed-files:
      - any-glob-to-any-file:
          - roles/**

# Was `firewall/**`, which matched nothing: the role lives under roles/.
firewall:
  - changed-files:
      - any-glob-to-any-file:
          - roles/firewall/**
          - extensions/molecule/firewall/**
