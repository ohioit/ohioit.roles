---
# Tags and publishes a release once its pull request is merged.
#
# A person does the first half by hand, in three steps (see CONTRIBUTING.md):
# bump `version:` in galaxy.yml, run `mise run release` to collect the changelog
# fragments, and open a pull request like any other change. Because a person
# pushes that branch, every required check runs on it.
#
# This workflow then does the rest. It pushes no commits and opens no pull
# requests, so the stock GITHUB_TOKEN is enough -- that token can create tags and
# releases, it just cannot push a commit in a way that starts workflows, which is
# what would otherwise force a GitHub App.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Should we release?
        id: check
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version:' galaxy.yml | cut -d: -f2 | tr -d ' "')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tag is the guard, not the commit message. That makes this job
          # idempotent: every push to main runs it, and only the one that
          # introduces a new version finds no tag and goes ahead.
          if [ "$version" = "0.0.0" ] || git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "Nothing to release ($version)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.check.outputs.release == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Build the collection
        if: steps.check.outputs.release == 'true'
        run: |
          uv sync --frozen
          uv run ansible-galaxy collection build --output-path dist --force

      # generate_release_notes lets GitHub list the merged pull requests, rather
      # than us maintaining a parser to pull one version's section out of
      # CHANGELOG.md. That file stays the curated record, added by the release
      # commit this tag points at.
      - name: Tag and publish
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.tar.gz
