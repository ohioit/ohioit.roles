---
# ansible-test sanity, one job per Core Lane.
#
# The template's `units` and `integration` jobs are gone, along with
# tests/units/ and tests/integration/: this collection ships no plugins or
# modules, so there was nothing for them to test. Role behaviour is proven by
# Molecule instead.
#
# The lane versions come from tools/molecule_plan.py, which reads each lane's
# ansible-core from its uv.lock. Moving the current lane from 2.21 to 2.22 is a
# Renovate bump of a lock file and no edit here.
name: Sanity

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.sanity_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv sync --frozen
      - name: Work out the lane matrix
        id: plan
        run: uv run tools/molecule_plan.py --github-output

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible_core }})
    needs: plan
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Perform sanity testing
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity
          pull-request-change-detection: false

  result:
    # The Required Check. Matched by job name: unique, and stable across a lane
    # move that changes every sanity job's name.
    name: Sanity Result
    if: always()
    needs:
      - plan
      - sanity
    runs-on: ubuntu-latest
    steps:
      # No skips are expected here: every lane in the table is always tested.
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
