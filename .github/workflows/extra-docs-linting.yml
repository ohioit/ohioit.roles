---
name: Lint extra docsite docs and links
on:
  # Run CI against all pushes (direct commits, also merged PRs), Pull Requests
  push:
    branches:
      - main
      - stable-*
  pull_request:
  # Run CI once per day (at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still testing against latest version of ansible-test for each ansible-base version
  # schedule:
  #   - cron: '0 6 * * *'

jobs:
  docsite:
    name: Lint extra docsite docs and links
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14" # Sync with mise.toml python version
      - name: Sync project deps
        run: uv sync --frozen
      # OPTIONAL If your collection depends on other collections, make sure to install them here
      # - name: Install dependent collections
      #   run: >
      #     uv run ansible-galaxy collection install
      #     ansible.netcommon
      #     ansible.utils
      # OR
      # - name: Install dependent collections
      #   run: >
      #     uv run ansible-galaxy collection install
      #     -r requirements.yml
      - name: Run collection docs linter
        run: uv run antsibull-docs lint-collection-docs . --plugin-docs --skip-rstcheck
