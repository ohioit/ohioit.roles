---
# Publishes a release to public Ansible Galaxy under the ohioit namespace.
#
# Publishing is a separate step from cutting the release, and today it only ever
# runs because a person started it. Two things are needed before it can work:
#
#   1. a dedicated Galaxy service account owning the ohioit namespace;
#   2. its API key stored as ANSIBLE_GALAXY_API_KEY in the `galaxy` environment,
#      which is restricted to tags.
#
# See docs/github-repo-settings.md.
name: Publish to Galaxy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, e.g. 0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    # The API key lives here rather than in repository secrets, so it is not
    # readable from an arbitrary branch. Add a required reviewer when publishing
    # becomes routine.
    environment: galaxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      # Built and published with the ansible-core this repository pins, so the
      # tarball that reaches Galaxy comes from the toolchain the tests ran on.
      # The version is whatever galaxy.yml holds at this tag, so nothing passed
      # in here can disagree with what was tagged.
      #
      # Deliberately not a third-party publishing action: the ones available run
      # from a mutable container tag, so pinning the action does not pin the code
      # that would receive this API key.
      - name: Build and publish
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          uv sync --frozen
          uv run ansible-galaxy collection build --output-path dist --force
          uv run ansible-galaxy collection publish dist/*.tar.gz \
            --api-key "$ANSIBLE_GALAXY_API_KEY"
