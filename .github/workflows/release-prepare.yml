---
name: Release Prepare

on:
  workflow_dispatch:

jobs:
  prepare_release:
    name: Create release draft
    runs-on: ubuntu-latest
    if: github.repository == 'ohioit/ohioit.roles'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install antsibull-changelog
        run: pipx install antsibull-changelog

      - name: Determine version bump type
        id: bump
        run: |
          bump="none"
          if grep -qE "^(major_changes:|breaking_changes:|removed_features:)" changelogs/fragments/*.yml; then
            bump="major"
          elif grep -qE "^(minor_changes:|deprecated_features:)" changelogs/fragments/*.yml; then
            bump="minor"
          elif grep -qE "^(security_fixes:|bugfixes:)" changelogs/fragments/*.yml; then
            bump="patch"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BUMP: ${{ steps.bump.outputs.bump }}
          DRY_RUN: true

      - name: Echo calculated version
        run: |
          echo "New version is: ${{ steps.version.outputs.new_tag }}"

      - name: Update galaxy.yml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.new_tag }}/" galaxy.yml
          echo "Updated galaxy.yml to version ${{ steps.version.outputs.new_tag }}"

      - name: Generate changelog
        run: |
          antsibull-changelog release

      - name: Commit updated files and open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          add-paths: |
            galaxy.yml
            CHANGELOG.*
            changelogs/changelog.yaml
            changelogs/fragments/**
          commit-message: "Prepare release ${{ steps.version.outputs.new_tag }}"
          branch: release/${{ steps.version.outputs.new_tag }}
          title: "Release ${{ steps.version.outputs.new_tag }}"
          body: |
            This PR prepares version `${{ steps.version.outputs.new_tag }}`.
            - Updated version in `galaxy.yml`
            - Generated release changelog
            - Draft release created

      - name: Delete old drafts
        uses: hugo19941994/delete-draft-releases@d375ad67d25fed7520a8020c3a6561fff5260c1e # v2.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: CHANGELOG.md
          draft: true
          name: ${{ steps.version.outputs.new_tag }}
          tag_name: ${{ steps.version.outputs.new_tag }}
          target_commitish: release/${{ steps.version.outputs.new_tag }}
