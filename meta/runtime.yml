---
# The floor is 2.16 because it is the only ansible-core that manages a stock
# RHEL 8 host (Python 3.6), and RHEL 8 stays in service until 2029-05-31.
#
# No upper bound: 2.17-2.20 are inside the supported range but untested. CI
# tests the two ends, the 2.16 Core Lane and the current one.
requires_ansible: '>=2.16.0'
