---
# Read by antsibull-docs. The collection publishes no docs site
# (the role READMEs are the documentation), but
# `antsibull-docs lint-collection-docs` still validates this file in CI, so the
# template's community.REPO_NAME placeholders had to go.
edit_on_github:
  repository: ohioit/ohioit.roles
  branch: main
  path_prefix: ''

extra_links:
  - description: Report an issue
    url: https://github.com/ohioit/ohioit.roles/issues/new

# No `communication:` section. This is an Ohio University IT collection, not a
# community one: support runs through the repository's issue tracker, linked
# above and automatically from galaxy.yml's `issues`. The schema's channel types
# (matrix_rooms, irc_channels, mailing_lists, forums) are all for public
# community collections, and the template's pointed at the Ansible project's own.
