---
minor_changes:
  - >-
    The collection now ships ``fedora.linux_system_roles`` 2.5.0 and
    ``ansible.posix`` >=2.2.2,<3.0.0, up from 2.4.2 and >=2.1.0,<2.2.0. The two
    had to move together: 2.4.2 required ``ansible.posix`` below 2.2.0, so
    neither could be bumped on its own.
  - >-
    ``community.general`` is now declared with a ceiling below 12.0.0. No role
    calls it, but ``fedora.linux_system_roles`` 2.5.0 stopped capping it, and
    ``community.general`` 12.x requires ansible-core 2.17 or later while this
    collection supports 2.16. Without the ceiling, a RHEL 8 controller would
    install a collection that does not support it.
