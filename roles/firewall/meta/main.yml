---
galaxy_info:
  author: Ohio University IT
  description: >-
    Configure firewalld from a simple rule syntax, layered across common, group
    and host scopes, with pruning of objects the rules no longer declare.
  company: Ohio University
  license: GPL-3.0-or-later

  # The collection's floor (meta/runtime.yml) is the real contract; this is the
  # role-level echo of it that ansible-galaxy and aar-doc read.
  min_ansible_version: "2.16"

  # The Molecule plan script reads these and turns each name+version pair into
  # a Target Platform host (EL + 8 -> el8). Adding a version here is all it
  # takes to add a Molecule job; nothing in the workflow changes.
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
        - "10"

  galaxy_tags:
    - firewall
    - firewalld
    - security
    - system

dependencies: []
