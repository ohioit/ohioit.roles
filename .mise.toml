[env]
PROJECT_NAME = "{{ config_root | basename }}"

[settings]
python.uv_venv_auto = "create|source"

[tools]
# The `current` Core Lane's controller Python, and the only one this file knows
# about. The 2.16 lane needs Python 3.12, which uv downloads for
# lanes/core-2.16/ on its own -- deliberately, so the dev environment is not
# pinned to the oldest lane's interpreter.
#
# Renovate is configured not to touch this version: moving it is a hand-made,
# dedicated pull request.
"python" = "3.14"
"uv" = "0.12.18"

[tasks.molecule]
description = "Run a role's Molecule scenario: molecule <role> [platform] [--lane 2.16|current]"
run = "tools/run-molecule.sh"

[tasks.docs]
description = "Regenerate the generated options block in every role README"
# Keep identical to the docs-current step in .github/workflows/lint.yml. If they
# drift, that check goes red, which is what it is for.
run = "for role in roles/*/; do uv run aar-doc --output-mode inject --output-template tools/aar-doc-template.md.j2 \"$role\" markdown; done"

[tasks.release]
description = "Collect the changelog fragments for the version in galaxy.yml"
# Reads the version from galaxy.yml, writes CHANGELOG.md and
# changelogs/changelog.yaml, and removes the fragments it consumed.
run = "uv run antsibull-changelog release"

[tasks.lint]
description = "Everything lint.yml runs, except the Molecule scenarios"
run = [
    "uv run ansible-lint",
    "uv run yamllint --strict .",
    "uv run antsibull-docs lint-collection-docs . --plugin-docs --skip-rstcheck",
    "uv run tools/defaults_vs_spec.py",
]

[tasks.test]
description = "Run the tests for the repo's own tooling"
run = "uv run pytest"

[tasks.changelog]
description = "Lint the changelog fragments on this branch"
run = "uv run antsibull-changelog lint"
